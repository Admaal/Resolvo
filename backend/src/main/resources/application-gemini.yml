spring:
  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai
    # Sin reintentos largos: con el valor por defecto (10 intentos y esperas de hasta minutos) una
    # sobrecarga de Google dejaba la peticion colgada. Fallar pronto deja pasar al modelo siguiente.
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    google:
      genai:
        api-key: ${RESOLVO_GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-flash-lite-latest
            temperature: 0.2
        embedding:
          api-key: ${RESOLVO_GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
              task-type: RETRIEVAL_DOCUMENT

resolvo:
  gemini:
    # Modelos de redaccion. Al arrancar se sondean todos a la vez y se ordenan por lo rapido que
    # responden; los que fallan quedan al final. En cada peticion se prueban por ese orden y, si uno
    # da 404 (retirado), 503 (saturado), cuota agotada o no contesta a tiempo, se pasa al siguiente.
    # Se cambian con RESOLVO_GEMINI_MODELOS (separados por comas) sin tocar el codigo. Los "latest"
    # son alias que apuntan al modelo vigente; los lite son los mas rapidos y los menos saturados.
    modelos: ${RESOLVO_GEMINI_MODELOS:gemini-flash-lite-latest,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-latest,gemini-3.5-flash,gemini-3.8-flash}
    timeout-segundos: 15
    max-intentos: 3
    # Nivel de razonamiento de los modelos Gemini 3 (minimal, low, medium o high; vacio, el del
    # modelo). Se deja el del modelo: con low los evals del 2026-11-26 bajaron la cita de la fuente
    # esperada del 90 % al 83 % (fallaban los tickets resueltos como fuente) y el p95 solo paso de
    # 6,1 a 5,5 s, con otro modelo elegido por el sondeo (runs 45811692821 y 45813572386, ADR-0011).
    razonamiento: ${RESOLVO_GEMINI_RAZONAMIENTO:}
