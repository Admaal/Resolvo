spring:
  ai:
    model:
      chat: google-genai
      embedding:
        text: google-genai
    google:
      genai:
        api-key: ${RESOLVO_GEMINI_API_KEY:}
        chat:
          options:
            model: gemini-2.5-flash
            temperature: 0.2
        embedding:
          api-key: ${RESOLVO_GEMINI_API_KEY:}
          text:
            options:
              model: gemini-embedding-001
              dimensions: 768
              task-type: RETRIEVAL_DOCUMENT
