server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  datasource:
    url: ${RESOLVO_DB_URL:jdbc:postgresql://localhost:5432/resolvo}
    username: ${RESOLVO_DB_USER:resolvo}
    password: ${RESOLVO_DB_PASSWORD:resolvo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    placeholder-replacement: false
    # Neon: la app sirve por el endpoint pooled y migra por la conexion directa (ADR-0009).
    # Sin RESOLVO_DB_MIGRATION_*, Flyway usa la misma conexion que la app.
    url: ${RESOLVO_DB_MIGRATION_URL:${spring.datasource.url}}
    user: ${RESOLVO_DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${RESOLVO_DB_MIGRATION_PASSWORD:${spring.datasource.password}}
  jackson:
    serialization:
      write-dates-as-timestamps: false

resolvo:
  cookie:
    secure: false
  jwt:
    secret: ${RESOLVO_JWT_SECRET}
  # RESOLVO_IA_SINCRONA: solo para tests; indexa en el hilo de la peticion en vez de en segundo plano.
  ia:
    indexar-al-arrancar: ${RESOLVO_IA_INDEXAR_AL_ARRANCAR:true}
    sincrona: ${RESOLVO_IA_SINCRONA:false}
  rag:
    # Distancia coseno maxima (0 identico, 2 opuesto) para citar un fragmento. 2.0 no descarta nada:
    # se fija con el eval de recuperacion (ADR-0011) cuando haya una corrida real que la calibre.
    distancia-maxima: ${RESOLVO_RAG_DISTANCIA_MAXIMA:2.0}

---
# IA apagada salvo con el perfil "gemini": sin RESOLVO_GEMINI_API_KEY la app arranca y los
# endpoints de IA responden 503. La autoconfiguracion de Spring AI exige credenciales al crearse,
# asi que se excluye entera en vez de apagarla por propiedad.
spring:
  config:
    activate:
      on-profile: "!gemini"
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
