server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  datasource:
    url: ${RESOLVO_DB_URL:jdbc:postgresql://localhost:5432/resolvo}
    username: ${RESOLVO_DB_USER:resolvo}
    password: ${RESOLVO_DB_PASSWORD:resolvo}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    placeholder-replacement: false
    # Neon: la app sirve por el endpoint pooled y migra por la conexion directa (ADR-0009).
    # Sin RESOLVO_DB_MIGRATION_*, Flyway usa la misma conexion que la app.
    url: ${RESOLVO_DB_MIGRATION_URL:${spring.datasource.url}}
    user: ${RESOLVO_DB_MIGRATION_USER:${spring.datasource.username}}
    password: ${RESOLVO_DB_MIGRATION_PASSWORD:${spring.datasource.password}}
  jackson:
    serialization:
      write-dates-as-timestamps: false

resolvo:
  cookie:
    secure: false
  jwt:
    secret: ${RESOLVO_JWT_SECRET}
  # RESOLVO_IA_SINCRONA: solo para tests; indexa en el hilo de la peticion en vez de en segundo plano.
  ia:
    indexar-al-arrancar: ${RESOLVO_IA_INDEXAR_AL_ARRANCAR:true}
    sincrona: ${RESOLVO_IA_SINCRONA:false}
    # Precios de lista en USD por millon de tokens, nivel de pago estandar, de la pagina oficial de
    # precios de Gemini (fuente y fecha en cada entrada). Con el nivel gratuito la factura real es 0:
    # esto es lo que costaria a precio de lista. Los alias "latest" y los modelos sin precio publicado
    # no figuran: su coste queda desconocido (nulo), nunca 0. gemini-3.8-flash cuesta el doble desde
    # el 2027-01-01 (1,50 de entrada y 7,50 de salida).
    tarifas:
      - modelo: gemini-3.5-flash-lite
        entrada-usd-por-millon: 0.30
        salida-usd-por-millon: 2.50
        fuente: https://aistudio.google.com/docs/pricing
        fecha: 2026-11-19
      - modelo: gemini-3.1-flash-lite
        entrada-usd-por-millon: 0.25
        salida-usd-por-millon: 1.50
        fuente: https://aistudio.google.com/docs/pricing
        fecha: 2026-11-19
      - modelo: gemini-3.8-flash
        entrada-usd-por-millon: 0.75
        salida-usd-por-millon: 3.75
        fuente: https://aistudio.google.com/docs/pricing
        fecha: 2026-11-19
      - modelo: gemini-3.6-flash
        entrada-usd-por-millon: 0.75
        salida-usd-por-millon: 3.75
        fuente: https://aistudio.google.com/docs/pricing
        fecha: 2026-11-19
      - modelo: gemini-2.5-flash-lite
        entrada-usd-por-millon: 0.10
        salida-usd-por-millon: 0.40
        fuente: https://aistudio.google.com/docs/pricing
        fecha: 2026-11-19
  eventos:
    max-intentos: 5
  rag:
    # Distancia coseno maxima (0 identico, 2 opuesto) para citar un fragmento; 2.0 no descartaria nada.
    # Unica fuente del valor: el codigo no lleva otro por defecto.
    # 0,29 sale de la primera corrida real de los evals (2026-11-18, ADR-0011): las consultas con
    # respuesta quedaron por debajo de 0,24 y las que no la tienen por encima de 0,34. Es un margen
    # estrecho (unos 0,05 a cada lado) sobre una muestra pequena, 16 consultas con respuesta contra 6
    # sin ella, y solo de articulos: no se midio con los tickets resueltos que tambien son fuentes.
    # Si una consulta real se queda sin citas, se sube con RESOLVO_RAG_DISTANCIA_MAXIMA y se
    # recalibra con mas casos.
    distancia-maxima: ${RESOLVO_RAG_DISTANCIA_MAXIMA:0.29}

---
# IA apagada salvo con el perfil "gemini": sin RESOLVO_GEMINI_API_KEY la app arranca y los
# endpoints de IA responden 503. La autoconfiguracion de Spring AI exige credenciales al crearse,
# asi que se excluye entera en vez de apagarla por propiedad.
spring:
  config:
    activate:
      on-profile: "!gemini"
  autoconfigure:
    exclude:
      - org.springframework.ai.model.google.genai.autoconfigure.chat.GoogleGenAiChatAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
