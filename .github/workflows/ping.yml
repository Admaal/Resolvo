name: Ping

# Un único ping cada 5 minutos para que Render Free no duerma la API (ADR-0009).
# GitHub desactiva los workflows programados tras 60 días sin actividad en el repo.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping a /api/salud
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/salud
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            https://resolvo-api.onrender.com/api/salud
