<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Resolvo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resolvo: helpdesk para equipos de soporte con sugerencias de IA citadas y aprobación humana.">
  <meta name="color-scheme" content="dark light">
  <meta name="text-scale" content="scale">
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Tema antes del primer pintado: elección guardada o preferencia del sistema.
    (function () {
      try {
        var guardado = localStorage.getItem('resolvo.tema');
        var tema = guardado === 'light' || guardado === 'dark'
          ? guardado
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = tema;
      } catch (e) { /* sin almacenamiento: se queda el tema oscuro */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
