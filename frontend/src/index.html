<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Resolvo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resolvo: helpdesk para equipos de soporte con sugerencias de IA citadas y aprobación humana.">
  <meta name="color-scheme" content="dark light">
  <meta name="text-scale" content="scale">
  <meta name="theme-color" content="#08090a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    // Tema antes del primer pintado: elección guardada o preferencia del sistema.
    (function () {
      try {
        var guardado = localStorage.getItem('resolvo.tema');
        var tema = guardado === 'light' || guardado === 'dark'
          ? guardado
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = tema;
      } catch (e) { /* sin almacenamiento: se queda el tema oscuro */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
