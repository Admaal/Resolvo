<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>Resolvo</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resolvo: helpdesk para equipos de soporte con sugerencias de IA citadas y aprobación humana.">
  <link rel="canonical" href="https://resolvo-6lc.pages.dev/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Resolvo">
  <meta property="og:locale" content="es_ES">
  <meta property="og:url" content="https://resolvo-6lc.pages.dev/">
  <meta property="og:title" content="Resolvo: helpdesk con IA verificable">
  <meta property="og:description" content="Proyecto de portfolio. La IA propone la respuesta, cita de qué artículos sale y una persona la aprueba. Entra a la demo con un clic.">
  <meta property="og:image" content="https://resolvo-6lc.pages.dev/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Portada de Resolvo con los accesos de demo y la bandeja de tickets">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="color-scheme" content="dark light">
  <meta name="text-scale" content="scale">
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3eee5" media="(prefers-color-scheme: light)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="/fonts/fraunces-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Tema antes del primer pintado: elección guardada o preferencia del sistema.
    (function () {
      try {
        var guardado = localStorage.getItem('resolvo.tema');
        var tema = guardado === 'light' || guardado === 'dark'
          ? guardado
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = tema;
      } catch (e) { /* sin almacenamiento: se queda el tema oscuro */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
